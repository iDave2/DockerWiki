#
#  /etc/apache2/conf-available/docker-php.conf
#
#  Instructions lifted from
#
#      https://www.mediawiki.org/wiki/Manual:Security#Upload_security,
#
#  this patch boosts security on the MediaWiki semi-public image tree.
#
#  I'm liking three-space tabs.  Maybe I will switch to debian.
#  Join the 3-spacers.  Is that a word yet?
#
####-####+####-####+####-####+####-####+####-####+####-####+####-####+####

<FilesMatch \.php$>
	SetHandler application/x-httpd-php
</FilesMatch>

DirectoryIndex disabled
DirectoryIndex index.php index.html

<Directory /var/www/>
	Options -Indexes
	AllowOverride All
</Directory>

# That was the original docker-php.conf; this is the new stuff:

<Directory "/var/www/html/images">
   # Ignore .htaccess files
   AllowOverride None

   # Serve HTML as plaintext, don't execute SHTML
   AddType text/plain .html .htm .shtml .phtml

   # Don't run arbitrary PHP code. (When using mod_php)
   php_admin_flag engine off
   # If using php-fpm, do the following instead:
   #<FilesMatch "\.php$">
   #  SetHandler none
   #</FilesMatch>

   # Tell browsers not to execute scripts
   Header set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline' data:; font-src data:; img-src data: 'self'; media-src data: 'self'; sandbox"

   # Tell browsers to not sniff files
   Header set X-Content-Type-Options nosniff

   # If you've other scripting languages, disable them too.
</Directory>

# ?

ServerName wiki-view-1